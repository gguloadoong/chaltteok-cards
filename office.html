const imgs = D.members.map(m => { const i = new Image(); i.src = m.sprite; return i; });

function px(cx, cy, w, h, col){ x.fillStyle = col; x.fillRect(cx, cy, w, h); }

// 방 — 벽, 바닥, 창문
function room(f){
  px(0,0,640,300,'#0B0814');
  px(0,0,640,196,'#241B3A');
  px(0,196,640,104,'#3A2C55');
  px(0,192,640,4,'#1A1330');
  // 창문 2개 (별 반짝임)
  [[52,34],[520,34]].forEach(([wx,wy],k)=>{
    px(wx,wy,72,52,'#120C22'); px(wx+3,wy+3,66,46,'#1B1436');
    for(let i=0;i<7;i++){
      const sx=wx+7+((i*17+k*9)%56), sy=wy+7+((i*13+k*5)%38);
      const tw=(Math.sin((f/26)+i+k*2)+1)/2;
      x.globalAlpha=.25+tw*.75; px(sx,sy,2,2,'#F6B81D'); x.globalAlpha=1;
    }
    px(wx,wy,72,3,'#0B0814'); px(wx,wy+49,72,3,'#0B0814');
  });
  // 벽 시계
  px(300,30,40,40,'#1B1436'); px(303,33,34,34,'#F2ECFA');
  px(319,38,2,14,'#241B3A'); px(320,49,10,2,'#241B3A');
}

function desk(dx, dy, tone, busy, f){
  px(dx, dy, 116, 8, '#5B4682');          // 상판
  px(dx+6, dy+8, 8, 26, '#40305F');       // 다리
  px(dx+102, dy+8, 8, 26, '#40305F');
  const my = dy - 34;
  px(dx+34, my, 48, 32, '#171029');       // 모니터
  px(dx+37, my+3, 42, 26, busy ? '#0E2A22' : '#14102A');
  if (busy){                               // 스크롤되는 코드 줄
    for (let i=0;i<5;i++){
      const w = 8 + ((i*13 + Math.floor(f/9)) % 30);
      x.globalAlpha = .55 + .45*Math.sin((f/16)+i);
      px(dx+40, my+6+i*5, w, 2, tone); x.globalAlpha = 1;
    }
  } else {
    px(dx+40, my+16, 34, 2, '#2C2340');
  }
  px(dx+54, my+32, 8, 6, '#171029');      // 목
  px(dx+44, my+38, 28, 3, '#171029');     // 받침
}

function bubble(bx, by, text, tone){
  x.font = '11px "Apple SD Gothic Neo", sans-serif';
  const w = Math.min(150, x.measureText(text).width + 14);
  px(bx-2, by-2, w+4, 22, '#0B0814');
  px(bx, by, w, 18, '#F2ECFA');
  px(bx+8, by+18, 6, 4, '#F2ECFA');
  x.fillStyle = '#171029'; x.textBaseline = 'top';
  x.fillText(text, bx+7, by+4, w-12);
  px(bx, by, 3, 18, tone);
}

function draw(f){
  room(f);
  const n = D.members.length;
  const slotW = 640 / n;
  D.members.forEach((m, i) => {
    const tone = TONE[m.status] || '#9A8DB2';
    const busy = m.status === 'working';
    const dx = Math.round(i*slotW + slotW/2 - 58);
    const dy = 214;
    desk(dx, dy, tone, busy, f + i*40);

    const img = imgs[i];
    if (img && img.complete && img.naturalWidth){
      const s = 2.6;
      const w = Math.round(img.naturalWidth*s), h = Math.round(img.naturalHeight*s);
      // 일하는 중이면 살짝 들썩인다
      const bob = busy ? Math.round(Math.sin((f+i*30)/18)*2) : 0;
      x.drawImage(img, Math.round(dx+58-w/2), Math.round(dy-h+8+bob), w, h);
    }
    // 이름표
    x.font = 'bold 12px "Apple SD Gothic Neo", sans-serif';
    x.fillStyle = '#F2ECFA'; x.textAlign = 'center'; x.textBaseline = 'top';
    x.fillText(m.name, dx+58, dy+42);
    x.font = '10px "Apple SD Gothic Neo", sans-serif'; x.fillStyle = tone;
    x.fillText(m.role, dx+58, dy+58);
    x.textAlign = 'left';

    // 상태 표시 — 막히면 느낌표가 깜빡, 준비 중이면 Z
    if (m.status === 'blocked' && Math.floor(f/22) % 2 === 0){
      x.font = 'bold 20px sans-serif'; x.fillStyle = '#F2857A';
      x.fillText('!', dx+96, dy-72);
    }
    if (m.status === 'new'){
      x.font = '12px sans-serif'; x.fillStyle = '#9A8DB2';
      x.globalAlpha = .4 + .6*((Math.sin(f/30)+1)/2);
      x.fillText('z', dx+96, dy-70 - (f/6 % 10)); x.globalAlpha = 1;
    }
    if (i === 0 || m.status !== 'working') bubble(dx+2, dy-92, m.say, tone);
  });
}

let f = 0;
(function loop(){ f++; draw(f); requestAnimationFrame(loop); })();

// 아래 표들
const num = v => (v===null||v===undefined) ? '—' : (typeof v==='number' ? v.toLocaleString() : v);
document.getElementById('stamp').textContent = D.now + ' KST 기준';
document.getElementById('kpi').innerHTML = [
  ['th_views','쓰레드 조회'],['th_followers_count','쓰레드 팔로워'],
  ['ig_reach','인스타 도달'],['ig_followers','인스타 팔로워'],['ig_media','인스타 게시물'],
].map(([k,l]) => `<div><b>${num(D.metrics[k])}</b><span>${l}</span></div>`).join('');
document.getElementById('slots').innerHTML = D.slots.length ? D.slots.map(s =>
  `<li class="${s.bad?'bad':(s.skip?'skip':'')}"><span class="t">${s.at.slice(0,5)}</span>
   <span class="n">${s.name}</span><span class="r">${s.got.length?s.got.join(' · '):(s.skip?'건너뜀':'—')}</span></li>`
).join('') : '<li><span class="t">—</span><span class="r">오늘 아직 돌지 않았습니다</span></li>';
document.getElementById('events').innerHTML = D.events.length ? D.events.map(e =>
  `<li class="${e.ok?'':'bad'}"><span class="t">${(e.at||'').slice(11,16)}</span>
   <span class="n">${e.action}</span><span class="r">${e.detail||''}</span></li>`
).join('') : '<li><span class="t">—</span><span class="r">아직 기록이 없습니다</span></li>';
</script>
